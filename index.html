<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Circuit Craft: build circuit boards in 3D, simulate them live, read the schematic and solve equations, in the browser.">
  <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
  <title>Circuit Craft</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;500;700&display=swap">
</head>
<body data-view="board" data-tool="view">
  <nav class="tabs fade" role="tablist" data-i18n-aria="views">
    <button type="button" role="tab" data-view-tab="board" aria-selected="true" data-i18n="tab.board">Board</button>
    <button type="button" role="tab" data-view-tab="schematic" aria-selected="false" data-i18n="tab.sch">Schematic</button>
    <button type="button" role="tab" data-view-tab="sheet" aria-selected="false" data-i18n="tab.sheet">Sheet</button>
  </nav>

  <div id="stage" class="board-only"></div>
  <div id="tags" class="board-only"></div>
  <div id="probe-tag" class="tag probe board-only" hidden></div>
  <div class="legend fade board-only">
    <h1>Circuit Craft</h1>
    <p id="bom-line">—</p>
    <p class="tip" id="tip"></p>
  </div>
  <div id="warns" aria-live="polite"></div>

  <nav class="rail fade no-sheet" role="toolbar" data-i18n-aria="tools">
    <button class="ic" type="button" data-tool="view" aria-pressed="true" data-i18n-tip="s.view|V"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></button>
    <button class="ic" type="button" data-tool="probe" data-i18n-tip="s.probe|M"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><rect x="8.5" y="5.5" width="7" height="4"/><circle cx="12" cy="15" r="2.5"/></svg></button>
    <hr>
    <button class="ic" type="button" data-tool="source" data-i18n-tip="s.source|1"><svg viewBox="0 0 24 24"><path d="M3 12h6M15 12h6M9 6v12M15 9v6"/><path d="M17.5 4.5v3M16 6h3"/></svg></button>
    <button class="ic" type="button" data-tool="resistor" data-i18n-tip="s.resistor|2"><svg viewBox="0 0 24 24"><path d="M2 12h4l1.5-4 3 8 3-8 3 8 1.5-4h4"/></svg></button>
    <button class="ic" type="button" data-tool="pot" data-i18n-tip="s.pot|9"><svg viewBox="0 0 24 24"><path d="M2 14h4l1.5-4 3 8 3-8 3 8 1.5-4h4"/><path d="M6 21L18 5M18 5h-4M18 5v4"/></svg></button>
    <button class="ic" type="button" data-tool="capacitor" data-i18n-tip="s.capacitor|3"><svg viewBox="0 0 24 24"><path d="M3 12h7M14 12h7M10 6v12M14 6v12"/></svg></button>
    <button class="ic" type="button" data-tool="inductor" data-i18n-tip="s.inductor|8"><svg viewBox="0 0 24 24"><path d="M2 14h2a2.5 2.5 0 0 1 5 0a2.5 2.5 0 0 1 5 0a2.5 2.5 0 0 1 5 0h3"/></svg></button>
    <button class="ic" type="button" data-tool="diode" data-i18n-tip="s.diode|6"><svg viewBox="0 0 24 24"><path d="M2 12h6M16 12h6M8 6v12l8-6z M16 6v12"/></svg></button>
    <button class="ic" type="button" data-tool="led" data-i18n-tip="s.led|5"><svg viewBox="0 0 24 24"><path d="M2 14h5M15 14h7M7 8v12l8-6z M15 8v12"/><path d="M15 6l3-3M18 3h-2M18 3v2M18 8l3-3"/></svg></button>
    <button class="ic" type="button" data-tool="switch" data-i18n-tip="s.switch|7"><svg viewBox="0 0 24 24"><path d="M2 15h5M17 15h5M7 15l9-6"/><circle cx="7" cy="15" r="1.4" class="fill"/><circle cx="17" cy="15" r="1.4" class="fill"/></svg></button>
    <button class="ic" type="button" data-tool="nmos" data-i18n-tip="s.nmos|N"><svg viewBox="0 0 24 24"><path d="M2 12h6M8 7v10M11 6v12M11 8h7V3M11 16h7v5M11 12h7"/><path d="M13 10l-2 2 2 2"/></svg></button>
    <button class="ic" type="button" data-tool="pmos" data-i18n-tip="s.pmos|P"><svg viewBox="0 0 24 24"><path d="M2 12h4M8 7v10M11 6v12M11 8h7V3M11 16h7v5M11 12h7"/><circle cx="7" cy="12" r="1.3"/><path d="M16 10l2 2-2 2"/></svg></button>
    <button class="ic" type="button" data-tool="cpu" data-i18n-tip="s.cpu|4"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg></button>
    <hr>
    <button class="ic" type="button" data-tool="trace" data-i18n-tip="s.trace|T"><svg viewBox="0 0 24 24"><path d="M4 19V11h8V5h8"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg></button>
    <button class="ic" type="button" data-tool="erase" data-i18n-tip="s.erase|X"><svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H6l-3-3z"/><path d="M10 9l5 5M11 18h10"/></svg></button>
  </nav>

  <div class="corner fade" role="toolbar">
    <button class="ic" id="btn-theme" type="button">
      <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg viewBox="0 0 24 24" class="i-sun" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <span class="no-sheet group">
      <button class="ic" id="btn-power" type="button" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></button>
      <button class="ic" id="btn-pause" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M9 5v14M15 5v14"/></svg>
        <svg viewBox="0 0 24 24" class="i-play" hidden><path d="M7 5l12 7-12 7z"/></svg>
      </button>
      <button class="ic" id="btn-heat" type="button" aria-pressed="false" data-i18n-tip="tip.heat"><svg viewBox="0 0 24 24"><path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/><path d="M12 9v7"/></svg></button>
      <button class="ic board-only" id="btn-tags" type="button" aria-pressed="true" data-i18n-tip="tip.tags"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg></button>
      <button class="ic" id="btn-calc" type="button" aria-pressed="false" data-i18n-tip="tip.calc"><svg viewBox="0 0 24 24"><path d="M18 5H6l6 7-6 7h12"/></svg></button>
    </span>
    <button class="ic" id="btn-menu" type="button" aria-expanded="false" aria-controls="menu" data-i18n-tip="tip.menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" class="fill"/><circle cx="12" cy="12" r="1.5" class="fill"/><circle cx="19" cy="12" r="1.5" class="fill"/></svg></button>
    <div class="menu" id="menu" hidden>
      <div class="lbl" data-i18n="m.lang">Language</div>
      <div class="langs" id="langs"></div>
      <hr>
      <div class="lbl" data-i18n="m.sim">Simulation</div>
      <button id="btn-speed" type="button"><span data-i18n="m.speed">Speed</span> <kbd id="speed-lbl">× 1</kbd></button>
      <button id="btn-discharge" type="button"><span data-i18n="m.discharge">Discharge capacitors</span></button>
      <hr>
      <div class="lbl" data-i18n="m.edit">Editing</div>
      <button id="btn-rot" type="button"><span data-i18n="m.rotate">Rotate part</span> <kbd>R</kbd></button>
      <button id="btn-undo" type="button"><span data-i18n="m.undo">Undo</span> <kbd>Ctrl Z</kbd></button>
      <button id="btn-spin" type="button" aria-pressed="false"><span data-i18n="m.spin">Auto-rotate</span></button>
      <button id="btn-home" type="button"><span data-i18n="m.home">Reset view</span></button>
      <hr>
      <div class="lbl" data-i18n="m.examples">Examples</div>
      <button type="button" data-example="rc"><span data-i18n="ex.rc">RC filter with LED</span></button>
      <button type="button" data-example="not"><span data-i18n="ex.not">CMOS inverter (NOT gate)</span></button>
      <button type="button" data-example="nand"><span data-i18n="ex.nand">NAND gate</span></button>
      <hr>
      <div class="lbl" data-i18n="m.export">Export</div>
      <button id="btn-shot" type="button"><span data-i18n="m.shot">Board snapshot</span></button>
      <button id="btn-json" type="button"><span data-i18n="m.json">Circuit as JSON</span></button>
      <button id="btn-clear" type="button"><span data-i18n="m.clear">Clear board</span></button>
    </div>
  </div>

  <section class="panel no-sheet" id="calc-panel" hidden>
    <div class="ph"><h2 data-i18n="p.calc">Live calculations</h2><button class="x" type="button" data-close="calc-panel" data-i18n-aria="p.close">×</button></div>
    <dl class="sum" id="summary"></dl>
    <div id="calc-list"></div>
    <p class="soft" data-i18n="p.hint"></p>
  </section>

  <section class="panel" id="json-panel" hidden>
    <div class="ph"><h2 data-i18n="m.json">Circuit as JSON</h2><button class="x" type="button" data-close="json-panel" data-i18n-aria="p.close">×</button></div>
    <p data-i18n="p.jsonDesc"></p>
    <textarea id="json" spellcheck="false" data-i18n-aria="m.json"></textarea>
    <div class="row"><button id="btn-copy" type="button" data-i18n="b.copy">Copy</button><button id="btn-apply" type="button" data-i18n="b.apply">Apply</button></div>
    <div class="msg" id="json-msg" role="status"></div>
  </section>

  <section class="panel" id="shot-panel" hidden>
    <div class="ph"><h2 data-i18n="m.shot">Board snapshot</h2><button class="x" type="button" data-close="shot-panel" data-i18n-aria="p.close">×</button></div>
    <img id="shot-img" data-i18n-alt="p.shotAlt" alt="">
    <div class="row"><a id="shot-download" class="button" download="circuit-craft.png" data-i18n="b.download">Download PNG</a></div>
    <p data-i18n="p.shotHow"></p>
  </section>

  <section id="scope" class="no-sheet" hidden>
    <div class="ph"><h2 data-i18n="s.probe">Multimeter</h2>
      <span class="row"><button id="btn-window" type="button">1 s</button><button class="x" type="button" id="btn-scope-x" data-i18n-aria="s.remove">×</button></span></div>
    <div class="rd" id="scope-rd">—</div>
    <canvas id="scope-cv" data-i18n-aria="scope.aria"></canvas>
    <p class="soft" id="scope-note"></p>
  </section>

  <div id="heat-legend" class="no-sheet" hidden><b data-i18n="heat.title"></b><i></i><span><em id="hl-min">−</em><em>0 V</em><em id="hl-max">+</em></span></div>

  <main id="schematic" class="view-main">
    <section class="slate">
      <div class="slate-head"><h2 data-i18n="tab.sch">Schematic</h2><small data-i18n="sch.sub"></small><span class="sp"></span><button id="btn-svg" type="button" data-i18n="sch.copy">Copy SVG</button></div>
      <div class="sch-wrap"><div class="sch-stage" id="sch-stage"><div id="sch"></div><svg id="sch-over" aria-hidden="true"></svg></div></div>
      <div class="slate-foot" data-i18n="sch.note"></div>
    </section>
    <section class="slate">
      <div class="slate-head"><h2 data-i18n="bom.title">Bill of materials</h2><small id="bom-count">—</small><span class="sp"></span><button id="btn-bom" type="button" data-i18n="bom.copy">Copy table</button></div>
      <div class="bom-wrap"><table class="bom" id="bom-table"></table></div>
      <div class="slate-foot" data-i18n="bom.foot"></div>
    </section>
  </main>

  <main id="sheet" class="view-main">
    <section class="slate">
      <div class="slate-head"><h2 data-i18n="eq.title">Equations</h2><small data-i18n="eq.sub"></small><span class="sp"></span>
        <button id="btn-eq-apply" type="button" data-i18n="eq.applyBoard">Apply to board</button>
        <button id="btn-vars" type="button" data-i18n="eq.vars">Board variables</button>
        <button id="btn-eq-sample" type="button" data-i18n="eq.example">Example</button></div>
      <div class="editor"><div class="editor-in">
        <textarea id="eq" spellcheck="false" autocomplete="off" data-i18n-aria="eq.title"></textarea>
        <div id="eq-out" aria-live="polite"></div>
      </div></div>
      <div class="slate-foot" id="eq-help"></div>
    </section>
    <section class="slate">
      <div class="slate-head"><h2 data-i18n="plot.title">Graph</h2><small id="plot-note">—</small></div>
      <div class="plot-wrap"><canvas id="plot"></canvas></div>
      <div class="slate-foot" id="plot-legend">—</div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
